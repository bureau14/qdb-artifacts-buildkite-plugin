name: QuasarDB Artifacts
description: Upload and download build artifacts to S3-compatible stores (AWS S3, Cloudflare R2)
author: https://github.com/bureau14
requirements:
  - python3
configuration:
  properties:
    upload:
      type: object
      properties:
        project_id:
          type: string
          description: "Unique project identifier for namespacing artifacts (e.g. 'quasardb')"
        files:
          type: string
          description: "Glob pattern for files to upload (e.g. 'artifacts/**/*.tar.zst')"
        parallel:
          type: integer
          description: "Files uploaded simultaneously (default: 4)"
        concurrency:
          type: integer
          description: "Multipart threads per upload (default: 32)"
      required:
        - project_id
        - files
    promote:
      type: object
      properties:
        project_id:
          type: string
          description: "Unique project identifier of the artifacts to mark as latest (e.g. 'quasardb')"
        step:
          type: string
          description: "Artifact path to mark as latest successful build of the current step (e.g build-linux-amd64-haswell-release)"
      required:
        - project_id
        - step
    download:
      type: object
      properties:
        project_id:
          type: string
          description: "Unique project identifier of the artifacts to download (e.g. 'quasardb')"
        build_id:
          type: string
          description: "Build identifier to download from. Defaults to latest successful build of the current branch."
        step:
          type: string
          description: "Build step key to download from (cross-step)"
        output-dir:
          type: string
          description: "Download destination directory (default: '.')"
        extract:
          type: boolean
          description: "Stream-extract archives on download"
        clean:
          type: boolean
          description: "Remove output directory before downloading"
        parallel:
          type: integer
          description: "Files downloaded simultaneously (default: 4)"
        concurrency:
          type: integer
          description: "Multipart threads per download (default: 32)"
        files:
          type: array
          minItems: 1
          items:
            type: string
          description: "Archive globs with optional entry filters (e.g. '*-server.tar.zst!bin/*')"
      required:
        - project_id
        - step
        - files
    debug:
      type: boolean
      description: "Enable bash debug tracing"
  oneOf:
    - required: [upload]
    - required: [download]
    - required: [promote]
  additionalProperties: false
