name: QuasarDB Artifacts
description: Upload and download build artifacts to S3-compatible stores (AWS S3, Cloudflare R2)
author: https://github.com/bureau14
requirements:
  - python3
configuration:
  properties:
    upload:
      type: object
      properties:
        project_id:
          type: string
          description: "Unique project identifier for namespacing artifacts (defaults to BUILDKITE_PIPELINE_NAME)"
        variant:
          type: string
          description: "Build variant key to upload to"
        git_ref:
          type: string
          description: "Git ref to download from (e.g. 'refs/heads/main')"
        files:
          type: string
          description: "Glob pattern for files to upload (e.g. 'artifacts/**/*.tar.zst')"
        base_dir:
          type: string
          description: "Optional base directory to strip from uploaded object keys (e.g. 'dist')"
        parallel:
          type: integer
          description: "Files uploaded simultaneously (default: 4)"
        concurrency:
          type: integer
          description: "Multipart threads per upload (default: 32)"
      required:
        - variant
        - files
        - git_ref
    promote:
      type: object
      properties:
        project_id:
          type: string
          description: "Unique project identifier of the artifacts to mark as latest (defaults to BUILDKITE_PIPELINE_NAME)"
        variant:
          type: string
          description: "Artifact path to mark as latest successful build of the current variant (e.g linux-amd64-haswell-release)"
        git_ref:
          type: string
          description: "Git ref to promote (e.g. 'refs/heads/main')"
      required:
        - variant
        - git_ref
    download:
      type: object
      properties:
        project_id:
          type: string
          description: "Unique project identifier of the artifacts to download (defaults to BUILDKITE_PIPELINE_NAME)"
        build_id:
          type: string
          description: "Build identifier to download from. Defaults to BUILDKITE_BUILD_ID if project_id matches current pipeline, else LATEST_SUCCESSFUL."
        variant:
          type: string
          description: "Build variant key to download from (cross-step)"
        git_ref:
          type: string
          description: "Git ref to download from (e.g. 'refs/heads/main')"
        output-dir:
          type: string
          description: "Download destination directory (default: '.')"
        extract:
          type: boolean
          description: "Stream-extract archives on download"
        clean:
          type: boolean
          description: "Remove output directory before downloading"
        parallel:
          type: integer
          description: "Files downloaded simultaneously (default: 4)"
        concurrency:
          type: integer
          description: "Multipart threads per download (default: 32)"
        files:
          type: array
          minItems: 1
          items:
            type: string
          description: "Archive globs with optional entry filters (e.g. '*-server.tar.zst!bin/*')"
      required:
        - variant
        - files
        - git_ref
    debug:
      type: boolean
      description: "Enable bash debug tracing"
  oneOf:
    - required: [upload]
    - required: [download]
    - required: [promote]
  additionalProperties: false
