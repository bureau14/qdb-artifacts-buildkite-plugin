name: QuasarDB Artifacts
description: Upload and download build artifacts to S3-compatible stores (AWS S3, Cloudflare R2)
author: https://github.com/bureau14
requirements:
  # Run from the path the agent names in QDB_CICD_AGENT_PLUGIN_PYTHON, never from PATH.
  - python3.13
configuration:
  properties:
    step:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      description: "The step id of a step that uploads or promotes: what it makes for its platform, the same on every platform (e.g. 'build'). A pipeline.py writes step_id in its template, and the runner's load_template writes this option; a pipeline without pipeline.py writes it beside upload."
    key:
      type: string
      pattern: "^[0-9a-f]{40}-[0-9a-f]{32}$"
      description: "Written by the plan step, never by a person: the key of the build, under which its uploads, promotes and own downloads lie. Without it, each job computes a key of its own build."
    upload:
      type: object
      properties:
        variant:
          type: string
          description: "The platform the step uploads (e.g. 'linux-amd64-release')"
        files:
          type: string
          description: "Glob pattern for files to upload (e.g. 'artifacts/**/*.tar.zst')"
        base_dir:
          type: string
          description: "Optional base directory to strip from uploaded object keys (e.g. 'dist')"
        exclude:
          type: array
          minItems: 1
          items:
            type: string
          description: "Glob patterns to exclude from upload after files have matched (e.g. '*-debug.tar.zst')"
        parallel:
          type: integer
          description: "Files uploaded simultaneously (default: 4)"
        concurrency:
          type: integer
          description: "Multipart threads per upload (default: 32)"
        annotate:
          type: boolean
          description: "Create a Buildkite job annotation listing uploaded artifacts (default: true)"
        allow_empty:
          type: boolean
          default: false
          description: "Skip upload without error when no files match or all are excluded (default: false)"
      required:
        - variant
        - files
    promote:
      type: object
      properties:
        variant:
          type: string
          description: "The platform whose upload the promote makes official: this step's, or that of the step id step names (e.g linux-amd64-release)"
        step:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: "The step id to promote, when it is not this step's own: what another step of the same pipeline uploaded for the platform (e.g. 'build' from a step that checks it)"
      required:
        - variant
    download:
      type: object
      properties:
        clean:
          type: boolean
          description: "Remove output directory before downloading"
        parallel:
          type: integer
          description: "Files downloaded simultaneously across all projects (default: 4)"
        concurrency:
          type: integer
          description: "Multipart threads per download (default: 32)"
        projects:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              project_id:
                type: string
                description: "Unique project identifier of the artifacts to download (defaults to BUILDKITE_PIPELINE_SLUG)"
              variant:
                type: string
                description: "The platform to download"
              step:
                description: "The step ids to download, one or a list. Without it: from another project, every step of the platform; from the build's own project and branch, nothing, so it must be written."
                oneOf:
                  - type: string
                  - type: array
                    minItems: 1
                    items:
                      type: string
              keys:
                type: object
                additionalProperties:
                  type: string
                description: "Written by the plan step, never by a person: the key of each step the entry takes."
              latest:
                type: boolean
                description: "The download takes the latest successful build of the project, which is not planned"
              git_ref:
                type: string
                description: "Git ref whose latest successful build to download (e.g. 'refs/heads/main'); required for another project's entry without keys"
              require_strict_ref_match:
                type: boolean
                description: "Disable branch fallback (default: false)"
              output-dir:
                type: string
                description: "Download destination directory (default: '.')"
              extract:
                type: boolean
                description: "Stream-extract archives on download"
              files:
                type: array
                minItems: 1
                items:
                  type: string
                description: "Archive globs with optional entry filters (e.g. '*-server.tar.zst!bin/*')"
              exclude:
                type: array
                minItems: 1
                items:
                  type: string
                description: "Archive globs to exclude from download after files have matched (e.g. '*-test-javadoc.jar')"
            required:
              - variant
              - files
      required:
        - projects
    plan:
      type: string
      description: "Written by the runner (qdb_pipeline.run), never by a person: the gate step that enters a build with snapshot dependencies, and the path of the pipeline its command generated. After the command the plugin plans the build, then uploads that pipeline with the key of every step a download takes written into it, or the trigger steps of the dependencies that are built first."
    resume:
      type: string
      description: "Written by the plan step, never by a person: the gate step that goes on once the triggered dependency builds have ended, and the path of the generated pipeline. It uploads that pipeline, or fails and names the dependency that failed."
    leave:
      type: boolean
      description: "Written by the runner (qdb_pipeline.run), never by a person: the gate step that runs after every other step of a build with snapshot dependencies and records which steps did not pass."
    debug:
      type: boolean
      description: "Enable bash debug tracing"
  anyOf:
    - required: [upload]
    - required: [download]
    - required: [promote]
    - required: [plan]
    - required: [resume]
    - required: [leave]
  additionalProperties: false
