name: QuasarDB Artifacts
description: Upload and download build artifacts to S3-compatible stores (AWS S3, Cloudflare R2)
author: https://github.com/bureau14
requirements:
  - python3
configuration:
  properties:
    upload:
      type: object
      properties:
        project_id:
          type: string
          description: "Unique project identifier for namespacing artifacts (defaults to BUILDKITE_PIPELINE_NAME)"
        variant:
          type: string
          description: "Build variant key to upload to"
        git_ref:
          type: string
          description: "Git ref to download from (e.g. 'refs/heads/main')"
        files:
          type: string
          description: "Glob pattern for files to upload (e.g. 'artifacts/**/*.tar.zst')"
        base_dir:
          type: string
          description: "Optional base directory to strip from uploaded object keys (e.g. 'dist')"
        exclude:
          type: array
          minItems: 1
          items:
            type: string
          description: "Glob patterns to exclude from upload after files have matched (e.g. '*-debug.tar.zst')"
        parallel:
          type: integer
          description: "Files uploaded simultaneously (default: 4)"
        concurrency:
          type: integer
          description: "Multipart threads per upload (default: 32)"
        annotate:
          type: boolean
          description: "Create a Buildkite job annotation listing uploaded artifacts (default: true)"
        allow_empty:
          type: boolean
          default: false
          description: "Skip upload without error when no files match or all are excluded (default: false)"
        snapshot:
          type: string
          pattern: "^v1-[0-9a-f]{32}$"
          description: "Written by the plan step, never by a person: the key of the snapshot this build makes. The upload then also records in manifest.json where its files were made (source) and which builds the job downloaded (downloads)."
      required:
        - variant
        - files
        - git_ref
    promote:
      type: object
      properties:
        project_id:
          type: string
          description: "Unique project identifier of the artifacts to mark as latest (defaults to BUILDKITE_PIPELINE_NAME)"
        variant:
          type: string
          description: "Artifact path to mark as latest successful build of the current variant (e.g linux-amd64-haswell-release)"
        git_ref:
          type: string
          description: "Git ref to promote (e.g. 'refs/heads/main')"
        snapshot:
          type: string
          pattern: "^v1-[0-9a-f]{32}$"
          description: "Written by the plan step, never by a person: the key of the snapshot this build makes. After moving LATEST_SUCCESSFUL, promote then creates the snapshot pointer of the variant, once: the first build of the key to promote the variant holds it."
      required:
        - variant
        - git_ref
    download:
      type: object
      properties:
        clean:
          type: boolean
          description: "Remove output directory before downloading"
        parallel:
          type: integer
          description: "Files downloaded simultaneously across all projects (default: 4)"
        concurrency:
          type: integer
          description: "Multipart threads per download (default: 32)"
        projects:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              project_id:
                type: string
                description: "Unique project identifier of the artifacts to download (defaults to BUILDKITE_PIPELINE_NAME)"
              build_id:
                type: string
                description: "Build identifier to download from. Defaults to BUILDKITE_BUILD_ID if project_id and git_ref match the current pipeline/ref, else LATEST_SUCCESSFUL."
              variant:
                type: string
                description: "Build variant key to download from (cross-step)"
              git_ref:
                type: string
                description: "Git ref to download from (e.g. 'refs/heads/main')"
              require_strict_ref_match:
                type: boolean
                description: "Disable branch fallback (default: false)"
              output-dir:
                type: string
                description: "Download destination directory (default: '.')"
              extract:
                type: boolean
                description: "Stream-extract archives on download"
              files:
                type: array
                minItems: 1
                items:
                  type: string
                description: "Archive globs with optional entry filters (e.g. '*-server.tar.zst!bin/*')"
              exclude:
                type: array
                minItems: 1
                items:
                  type: string
                description: "Archive globs to exclude from download after files have matched (e.g. '*-test-javadoc.jar')"
            required:
              - variant
              - files
              - git_ref
      required:
        - projects
    plan:
      type: string
      description: "Written by the runner (qdb_pipeline.run), never by a person: the gate step that enters a build with snapshot dependencies, and the path of the pipeline its command generated. After the command the plugin plans the build, then uploads that pipeline with one build of every snapshot dependency written into it, or the trigger steps of the dependencies that are built first."
    resume:
      type: string
      description: "Written by the plan step, never by a person: the gate step that goes on once the triggered dependency builds have ended, and the path of the generated pipeline. It uploads that pipeline, or fails and names the dependency that failed."
    leave:
      type: boolean
      description: "Written by the runner (qdb_pipeline.run), never by a person: the gate step that runs after every other step of a build with snapshot dependencies and records which variants did not pass."
    debug:
      type: boolean
      description: "Enable bash debug tracing"
  anyOf:
    - required: [upload]
    - required: [download]
    - required: [promote]
    - required: [plan]
    - required: [resume]
    - required: [leave]
  additionalProperties: false
