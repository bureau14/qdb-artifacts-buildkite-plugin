name: QuasarDB Artifacts
description: Upload and download build artifacts to S3-compatible stores (AWS S3, Cloudflare R2)
author: https://github.com/bureau14
requirements:
  - python3
configuration:
  properties:
    upload:
      type: string
      description: "Glob pattern for files to upload (e.g. 'artifacts/**/*.tar.zst')"
    upload-parallel:
      type: integer
      description: "Number of files uploaded simultaneously (default: 4)"
    upload-concurrency:
      type: integer
      description: "Multipart threads per upload (default: 32)"
    download:
      type: object
      properties:
        step:
          type: string
          description: "Build step key to download from (cross-step)"
        output-dir:
          type: string
          description: "Download destination directory (default: '.')"
        extract:
          type: boolean
          description: "Stream-extract archives on download"
        clean:
          type: boolean
          description: "Remove output directory before downloading"
        parallel:
          type: integer
          description: "Files downloaded simultaneously (default: 4)"
        concurrency:
          type: integer
          description: "Multipart threads per download (default: 32)"
        files:
          type: array
          minItems: 1
          items:
            type: string
          description: "Archive globs with optional entry filters (e.g. '*-server.tar.zst!bin/*')"
      required:
        - step
        - files
    debug:
      type: boolean
      description: "Enable bash debug tracing"
  oneOf:
    - required: [upload]
    - required: [download]
  dependencies:
    upload-parallel: [upload]
    upload-concurrency: [upload]
  additionalProperties: false
