steps:
- label: build (linux-haswell-release)
  key: build-linux-haswell-release
  timeout_in_minutes: 60
  command: echo step
  plugins:
  - docker#v5.13.0: {}
  - bureau14/qdb-artifacts#master:
      promote:
        git_ref: refs/heads/sc-20192/snapshot-dependencies
        variant: linux-haswell-release
      upload:
        allow_empty: false
        files: artifacts/**/*.tar.zst
        git_ref: refs/heads/sc-20192/snapshot-dependencies
        variant: linux-haswell-release
  - ./.buildkite/plugins/timing: {}
- label: build (freebsd-haswell-release)
  key: build-freebsd-haswell-release
  timeout_in_minutes: 60
  command: echo step
  plugins:
  - bureau14/qdb-artifacts#master:
      promote:
        git_ref: refs/heads/sc-20192/snapshot-dependencies
        variant: freebsd-haswell-release
      upload:
        allow_empty: false
        files: artifacts/**/*.tar.zst
        git_ref: refs/heads/sc-20192/snapshot-dependencies
        variant: freebsd-haswell-release
  - ./.buildkite/plugins/timing: {}
- label: ':bar_chart: Build timing summary'
  key: full-test-report
  depends_on:
  - build-linux-haswell-release
  - build-freebsd-haswell-release
  allow_dependency_failure: true
  timeout_in_minutes: 30
  command: echo step
